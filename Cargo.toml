[package]
name = "code-scope"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yxshwanth/scope"
description = "A native code intelligence tool, built one working slice at a time"

[[bin]]
name = "scope"
path = "src/main.rs"

[dependencies]
serde_json = "1"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
ignore = "0.4"
notify = "8.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
